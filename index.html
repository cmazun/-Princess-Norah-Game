const starLayer=document.getElementById('stars');for(let i=0;i<24;i++){const s=document.createElement('span');s.className='star';s.textContent=i%3?'✧':'✦';s.style.left=((i*37+11)%94)+'%';s.style.top=((i*23+17)%77)+'%';s.style.fontSize=(9+i%4*5)+'px';s.style.animationDelay=-(i%8*.27)+'s';starLayer.append(s)}const game=document.getElementById('game'),rainbow=document.getElementById('rainbow'),status=document.getElementById('status'),points=document.getElementById('points'),winBox=document.getElementById('win'),again=document.getElementById('again'),princess=document.getElementById('princess');const colors=['#ff526e','#ff9c3b','#ffdf44','#47d878','#3ea9ff','#7357e7','#cf66e8'];let caught=new Set(),score=0,finished=false,muted=false,active=new Set(),audio,playing=false,easy=true;function unlockAudio(){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){console.warn('Audio unavailable',e)}}function sound(i){if(muted)return;try{unlockAudio();if(!audio)return;const t=audio.currentTime+.015,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(520+i*75,t);o.frequency.exponentialRampToValueAtTime(780+i*85,t+.12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.29);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.31)}catch(e){console.warn('Sound playback failed',e)}}function draw(){rainbow.replaceChildren();for(let i=0;i<7;i++){let el=document.createElement('i'),w=100-i*12;el.style.width=w+'%';el.style.height=w*1.1+'%';el.style.borderWidth='clamp(8px,2.7vw,14px)';el.style.borderColor=caught.has(i)?colors[i]:'#ffffffa0';rainbow.append(el)}}function spark(x,y){for(let j=0;j<12;j++){let s=document.createElement('span');s.className='burst';s.textContent=j%2?'✦':'✧';s.style.color=colors[j%7];s.style.left=x+20+'px';s.style.top=y+20+'px';let a=j*Math.PI/6;s.style.setProperty('--x',Math.round(Math.cos(a)*70)+'px');s.style.setProperty('--y',Math.round(Math.sin(a)*70)+'px');game.append(s);setTimeout(()=>s.remove(),800)}}function catchOrb(b,i){if(finished||!b.isConnected)return;let r=b.getBoundingClientRect(),gr=game.getBoundingClientRect();spark(r.left-gr.left+15,r.top-gr.top);princess.style.left=Math.max(18,Math.min(82,(r.left+r.width/2-gr.left)/gr.width*100))+'%';princess.classList.remove('happy');void princess.offsetWidth;princess.classList.add('happy');setTimeout(()=>princess.classList.remove('happy'),520);b.remove();active.delete(b);score+=10;points.textContent=score;caught.add(i);sound(i);draw();status.textContent=caught.size+' of 7 colors collected • Score '+score;if(caught.size===7){finished=true;princess.classList.add('celebrate');winBox.style.display='block';again.style.display='block';status.textContent='The rainbow is complete!';active.forEach(el=>el.remove());active.clear()}}function spawn(){if(!playing||finished||active.size>=6)return;let i=Math.floor(Math.random()*7),b=document.createElement('button');b.className='orb';b.style.background=colors[i];b.style.left=(6+Math.random()*75)+'%';b.style.top='100%';b.setAttribute('aria-label','Catch '+['red','orange','yellow','green','blue','indigo','violet'][i]+' bubble');game.append(b);active.add(b);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();catchOrb(b,i)},{passive:false});setTimeout(()=>{b.remove();active.delete(b)},5800)}game.addEventListener('pointerdown',e=>{if(finished||e.target.closest('button'))return;let near=null,best=easy?115:48;for(const b of active){let r=b.getBoundingClientRect(),d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));if(d<best){best=d;near=b}}if(near){let name=near.getAttribute('aria-label');catchOrb(near,['red','orange','yellow','green','blue','indigo','violet'].indexOf(name.split(' ')[1]))}},{passive:true});again.onclick=()=>{princess.classList.remove('celebrate');caught.clear();score=0;points.textContent=0;finished=false;winBox.style.display='none';again.style.display='none';status.textContent='Tap bubbles to catch colors! 🌈';princess.style.left='50%';draw();for(let i=0;i<4;i++)setTimeout(spawn,i*300)};document.getElementById('sound').onclick=()=>{muted=!muted;if(!muted){unlockAudio();sound(4)}document.getElementById('sound').textContent=muted?'♪̸':'♫'};draw();document.getElementById('startBtn').onclick=()=>{playing=true;document.getElementById('menu').style.display='none';unlockAudio();sound(3);for(let i=0;i<5;i)setTimeout(spawn,i*450)};document.getElementById('optionsBtn').onclick=()=>document.getElementById('options').style.display='flex';document.getElementById('backBtn').onclick=()=>document.getElementById('options').style.display='none';document.getElementById('musicToggle').onchange=e=>{muted=!e.target.checked;if(!muted){unlockAudio();sound(4)}document.getElementById('sound').textContent=muted?'♪̸':'♫'};document.getElementById('easyToggle').onchange=e=>easy=e.target.checked;setInterval(spawn,850);
