<g fill="#fff"><circle cx="81" cy="316" r="3"/><circle cx="218" cy="315" r="4"/><circle cx="149" cy="340" r="3"/><circle cx="112" cy="354" r="2.5"/><circle cx="190" cy="350" r="2.5"/><path d="M58 333L61 341L69 344L61 347L58 355L55 347L47 344L55 341Z"/><path d="M237 292L240 298L246 301L240 304L237 310L234 304L228 301L234 298Z"/></g></svg></div><header><div id="score">★ <span id="points">0</span></div><div id="title">Princess Norah's Rainbow Catch</div><button id="sound" aria-label="Toggle sound">♪</button></header><div id="status">Tap bubbles to catch colors!</div><div id="win">You did it, Norah!</div><button id="again">Play Again</button></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),game=$('game'),princess=$('princess'),colors=['#fa5a7b','#ffa144','#ffdb50','#4ed47c','#4caff9','#7665e9','#c975ed'];let playing=false,finished=false,score=0,caught=new Set(),active=new Set(),muted=true,easy=true,audio=null;
function playSound(n){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume().catch(()=>{});const t=audio.currentTime+.02,o=audio.createOscillator(),g=audio.createGain();o.frequency.value=480+n*85;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.24)}catch(e){}}
function pop(b,n){if(!b.isConnected||finished)return;const r=b.getBoundingClientRect(),gr=game.getBoundingClientRect();const s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.left=(r.left-gr.left+20)+'px';s.style.top=(r.top-gr.top)+'px';game.append(s);setTimeout(()=>s.remove(),650);b.remove();active.delete(b);princess.style.left=Math.max(18,Math.min(82,(r.left+r.width/2-gr.left)/gr.width*100))+'%';princess.classList.remove('happy');void princess.offsetWidth;princess.classList.add('happy');setTimeout(()=>princess.classList.remove('happy'),430);score+=10;caught.add(n);$('points').textContent=score;$('status').textContent=caught.size+' of 7 colors collected • Score '+score;playSound(n);if(caught.size===7){finished=true;active.forEach(x=>x.remove());active.clear();$('win').style.display='block';$('again').style.display='block';princess.classList.add('dance')}}
function spawn(){if(!playing||finished||active.size>=5||document.hidden)return;const n=Math.floor(Math.random()*7),b=document.createElement('button');b.className='orb';b.style.background=colors[n];b.dataset.color=String(n);b.style.left=(5+Math.random()*74)+'%';b.style.top='100%';b.setAttribute('aria-label','Catch color');game.append(b);active.add(b);b.addEventListener('pointerdown',e=>{e.stopPropagation();pop(b,n)});setTimeout(()=>{b.remove();active.delete(b)},5700)}
$('startBtn').addEventListener('click',()=>{playing=true;$('menu').style.display='none';spawn();setTimeout(spawn,500);setTimeout(spawn,1000)});
$('optionsBtn').addEventListener('click',()=>{$('options').style.display='flex'});$('backBtn').addEventListener('click',()=>{$('options').style.display='none'});
$('sound').addEventListener('click',()=>{muted=!muted;$('musicToggle').checked=!muted;$('sound').textContent=muted?'♪':'♫';if(!muted)playSound(2)});
$('musicToggle').addEventListener('change',e=>{muted=!e.target.checked;$('sound').textContent=muted?'♪':'♫';if(!muted)playSound(2)});
$('easyToggle').addEventListener('change',e=>{easy=e.target.checked});
game.addEventListener('pointerdown',e=>{if(!playing||finished||e.target.closest('button'))return;let nearest=null,best=easy?110:45;for(const b of active){const r=b.getBoundingClientRect(),d=Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2);if(d<best){best=d;nearest=b}}if(nearest){const idx=Number(nearest.dataset.color);pop(nearest,idx)}});
$('again').addEventListener('click',()=>{caught.clear();score=0;finished=false;$('points').textContent='0';$('win').style.display='none';$('again').style.display='none';princess.classList.remove('dance');$('status').textContent='Tap bubbles to catch colors!';spawn()});
setInterval(spawn,950);
const originalSpawn=spawn;
})();
