<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#a9e8ff"><title>Princess Norah's Rainbow Catch</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;touch-action:manipulation}body{background:linear-gradient(#a9e8ff,#fbe1fb);color:#604293}#scene{position:relative;height:100dvh;overflow:hidden}header{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 12px);width:100%;text-align:center;padding:0 50px}h1{font-size:clamp(19px,5vw,27px);margin:0;text-shadow:0 2px white}#message{font-weight:700;font-size:14px;margin:5px}#rainbow{position:absolute;top:22%;left:50%;transform:translateX(-50%);width:min(86vw,380px);aspect-ratio:2/1;overflow:hidden}#rainbow i{position:absolute;left:50%;bottom:0;transform:translateX(-50%);border-style:solid;border-bottom:0;border-radius:400px 400px 0 0;opacity:.95}.cloud{position:absolute;font-size:65px;opacity:.75;animation:drift 8s ease-in-out infinite alternate}.c1{top:19%;left:3%}.c2{top:27%;right:2%}@keyframes drift{to{transform:translateX(18px)}}#ground{position:absolute;bottom:-7%;left:-20%;width:140%;height:21%;border-radius:50% 50% 0 0;background:#91e5a3}#princess{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);font-size:100px;filter:drop-shadow(0 6px 3px #0002);animation:bob 1.7s ease-in-out infinite alternate}@keyframes bob{to{transform:translate(-50%,-9px)}}.orb{position:absolute;width:64px;height:64px;border:4px solid #fff9;border-radius:50%;box-shadow:inset -9px -10px 10px #0001,0 0 16px #fff9;animation:float 7s linear forwards;z-index:3;cursor:pointer;touch-action:manipulation}@keyframes float{from{transform:translateY(0)}to{transform:translateY(-115dvh)}}#sound{position:absolute;z-index:9;top:calc(env(safe-area-inset-top) + 12px);right:10px;border:0;background:#fff9;border-radius:50%;width:42px;height:42px;font-size:22px}#again{display:none;position:absolute;z-index:10;bottom:calc(env(safe-area-inset-bottom) + 20px);left:50%;transform:translateX(-50%);border:0;border-radius:24px;background:#ffda65;color:#604293;font-size:20px;font-weight:800;padding:15px 25px;white-space:nowrap}#celebrate{display:none;position:absolute;z-index:6;top:46%;width:100%;text-align:center;font-size:30px;font-weight:900;text-shadow:0 3px white}</style></head><body><div id="scene"><header><h1>Princess Norah's Rainbow Catch</h1><p id="message">Tap a color to help Norah catch it!</p></header><button id="sound" aria-label="Sound">♫</button><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div id="rainbow"></div><div id="ground"></div><div id="princess">👸🏻</div><div id="celebrate">🌈 Hooray, Norah! ✨</div><button id="again">Play Again ✨</button></div><script>
const scene=document.getElementById('scene'),rainbow=document.getElementById('rainbow'),message=document.getElementById('message'),again=document.getElementById('again'),celebrate=document.getElementById('celebrate');const colors=['#ff5b69','#ff9d39','#ffe454','#5cd77e','#4aaeff','#7465e9','#d678d8'];let caught=new Set(),orbs=[],win=false,muted=false,audio;function tone(i){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=420+i*80;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.26)}catch(e){}}function paint(){rainbow.innerHTML='';for(let i=0;i<7;i++){let e=document.createElement('i'),w=100-i*12;e.style.cssText='width:'+w+'%;height:'+(w*1.05)+'%;border-width:11px;border-color:'+(caught.has(i)?colors[i]:'#ffffff88')+';';rainbow.appendChild(e)}}function spawn(){if(win||orbs.length>=7)return;let i=Math.floor(Math.random()*7),b=document.createElement('button');b.className='orb';b.style.background=colors[i];b.style.left=(8+Math.random()*72)+'%';b.style.top='95%';b.setAttribute('aria-label','Catch color');scene.appendChild(b);orbs.push(b);b.addEventListener('pointerdown',e=>{e.preventDefault();if(win)return;caught.add(i);tone(i);b.remove();orbs=orbs.filter(x=>x!==b);paint();message.textContent=caught.size+' of 7 rainbow colors collected!';document.getElementById('princess').style.transform='translate(-50%,-20px)';setTimeout(()=>document.getElementById('princess').style.transform='',230);if(caught.size===7){win=true;message.textContent='All seven colors found!';celebrate.style.display='block';again.style.display='block';orbs.forEach(x=>x.remove());orbs=[]}});setTimeout(()=>{b.remove();orbs=orbs.filter(x=>x!==b)},7000)}again.onclick=()=>{caught.clear();win=false;celebrate.style.display='none';again.style.display='none';message.textContent='Tap a color to help Norah catch it!';paint();for(let i=0;i<4;i++)setTimeout(spawn,i*450)};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'♪̸':'♫'};paint();for(let i=0;i<5;i++)setTimeout(spawn,i*600);setInterval(spawn,1050);
</script></body></html>
